name: Maven Build
on:
	push:
	  branches: ["main"]
	pull_request:
	  branches: ["main"]
jobs:
  build:
	runs-on: ubuntu-lastest
	steps:
	  - name: Checkout source code
	    uses: actions/checkout@v6
			  
	  -	name: Set up JDK
		uses: actions/setup-java@v5
		with:
		  java-version: '17'
		  distribution: 'temurin'
		  cache: maven
	  - name: Build with Maven 
		run: mvn -B clean package